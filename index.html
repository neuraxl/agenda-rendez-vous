<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PNEUS RDV — Agenda</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    background: #f2f3f5;
    color: #1c2733;
    display: flex;
    flex-direction: column;
  }
  [hidden] { display: none !important; }

  /* ---------- Écran d'accès ---------- */
  #loginScreen {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #loginBox {
    background: #ffffff;
    border: 1px solid #c3ccd4;
    border-radius: 12px;
    padding: 34px 30px;
    width: min(420px, 92vw);
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,.12);
  }
  #loginBox h1 { font-size: 24px; margin-bottom: 6px; }
  #loginBox p { font-size: 15px; color: #43536a; margin-bottom: 18px; }
  #loginCode {
    width: 100%;
    font-size: 26px;
    font-weight: 700;
    text-align: center;
    letter-spacing: .12em;
    padding: 12px;
    border: 2px solid #9aa7b1;
    border-radius: 8px;
  }
  #loginCode:focus { border-color: #33506e; outline: none; }
  #loginError {
    min-height: 22px;
    margin-top: 10px;
    font-size: 15px;
    font-weight: 600;
    color: #c62828;
  }
  #btnLogin {
    width: 100%;
    margin-top: 12px;
    font-size: 18px;
    font-weight: 700;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #33506e;
    color: #ffffff;
    cursor: pointer;
  }
  #btnLogin:hover { background: #28405a; }
  #btnClient {
    width: 100%;
    margin-top: 14px;
    font-size: 16px;
    font-weight: 600;
    padding: 11px;
    border: 1px solid #33506e;
    border-radius: 8px;
    background: #ffffff;
    color: #33506e;
    cursor: pointer;
  }
  #btnClient:hover { background: #eef3f8; }

  /* ---------- Barre du haut ---------- */
  header {
    background: #ffffff;
    border-bottom: 2px solid #d7dce1;
    padding: 10px 14px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 22px;
  }
  #sessionBadge {
    font-size: 20px;
    font-weight: 700;
    padding: 9px 18px;
    border-radius: 8px;
    color: #ffffff;
  }
  #sessionBadge.g1 { background: #2e7d32; }
  #sessionBadge.g2 { background: #1565c0; }
  .nav { display: flex; align-items: center; gap: 8px; }
  .nav button, #btnLogout, #btnArchives {
    font-size: 15px;
    padding: 8px 14px;
    border: 1px solid #9aa7b1;
    border-radius: 6px;
    background: #eef1f4;
    color: #1c2733;
    cursor: pointer;
  }
  .nav button:hover, #btnLogout:hover, #btnArchives:hover { background: #dde4ea; }
  #btnArchives { margin-left: auto; }
  #weekLabel { font-size: 17px; font-weight: 700; margin-left: 6px; }
  .legend {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 14px;
    color: #43536a;
  }
  .sw {
    display: inline-block;
    width: 16px; height: 16px;
    border-radius: 3px;
    border: 1px solid rgba(0,0,0,.25);
    vertical-align: -3px;
  }
  .sw.g1 { background: #43a047; }
  .sw.g2 { background: #1e88e5; }
  .sw.free { background: #7cc47f; }
  .sw.taken { background: #f3d1d1; }
  #syncStatus { margin-left: 14px; font-size: 13px; font-style: italic; color: #6a7889; }

  /* ---------- Vue client ---------- */
  #clientTitle { font-size: 20px; font-weight: 700; padding: 9px 4px; }
  #btnClientBack {
    font-size: 15px;
    padding: 8px 14px;
    border: 1px solid #9aa7b1;
    border-radius: 6px;
    background: #eef1f4;
    color: #1c2733;
    cursor: pointer;
  }
  #btnClientBack:hover { background: #dde4ea; }
  #clientHint { font-size: 15px; color: #43536a; margin: 2px 0 10px; }
  #clientWeekLabel { font-size: 17px; font-weight: 700; margin-left: 6px; }
  #btnClientBack { margin-left: auto; }
  .ccell {
    height: 42px;
    border-radius: 5px;
    border: 1px solid rgba(0,0,0,.18);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 700;
    line-height: 1;
  }
  .ccell.free { background: #b9e4b9; cursor: pointer; }
  .ccell.free:hover { background: #8fd18f; }
  .ccell.taken { background: #f3d1d1; color: #b71c1c; }

  /* ---------- Grille ---------- */
  main { flex: 1; overflow: auto; padding: 10px 14px 16px; }
  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 1080px;
    background: #ffffff;
  }
  th, td { border: 1px solid #c3ccd4; }
  thead th {
    background: #33506e;
    color: #ffffff;
    font-size: 16px;
    padding: 9px 4px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 2;
  }
  thead th.today { background: #b8860b; }
  thead th .dow { display: block; font-size: 13px; font-weight: 400; text-transform: uppercase; letter-spacing: .06em; }
  td.time {
    background: #eef1f4;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
    width: 74px;
    padding: 0 4px;
    white-space: nowrap;
  }
  td.slot { padding: 3px; vertical-align: middle; }
  td.slot.today-col { box-shadow: inset 0 0 0 2px #b8860b; }
  .cells { display: flex; gap: 3px; }
  .cell {
    flex: 1 1 0;
    min-width: 0;
    height: 42px;
    border-radius: 5px;
    padding: 3px 5px;
    font-size: 13px;
    line-height: 1.25;
    overflow: hidden;
    border: 1px solid rgba(0,0,0,.18);
  }
  .cell .nm {
    display: block;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cell .pl {
    display: block;
    font-size: 11px;
    font-weight: 400;
    opacity: .9;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* Couleurs : vert = Garage 1, bleu = Garage 2 */
  .cell.g1 { background: #cdeccd; }
  .cell.g1.booked { background: #43a047; color: #ffffff; font-weight: 600; }
  .cell.g2 { background: #d3e5fa; }
  .cell.g2.booked { background: #1e88e5; color: #ffffff; font-weight: 600; }
  /* Ma couleur : cliquable */
  .cell.mine { cursor: pointer; }
  .cell.g1.mine:hover { background: #aee2ae; }
  .cell.g1.mine.booked:hover { background: #388e3c; }
  .cell.g2.mine:hover { background: #a9ccf5; }
  .cell.g2.mine.booked:hover { background: #1565c0; }
  /* L'autre couleur : lecture seule, atténuée */
  .cell.theirs { opacity: .45; cursor: default; }

  /* ---------- Fenêtre rendez-vous ---------- */
  #overlay {
    position: fixed; inset: 0;
    background: rgba(20, 30, 40, .45);
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
  }
  #overlay[hidden] { display: none; }
  #dialog {
    background: #ffffff;
    border-radius: 10px;
    padding: 22px;
    width: min(480px, 92vw);
    box-shadow: 0 12px 40px rgba(0,0,0,.35);
  }
  #dialog h2 { font-size: 19px; margin-bottom: 4px; }
  #dialog .when { font-size: 15px; color: #43536a; margin-bottom: 6px; }
  #dialog label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #43536a;
    margin: 12px 0 4px;
  }
  #dialog input[type="text"], #dialog input[type="tel"] {
    width: 100%;
    font: inherit;
    font-size: 16px;
    padding: 9px;
    border: 1px solid #9aa7b1;
    border-radius: 6px;
  }
  #dialog input:focus { border-color: #33506e; outline: none; }
  #dlgError {
    min-height: 20px;
    margin-top: 10px;
    font-size: 14px;
    font-weight: 600;
    color: #c62828;
  }
  #dialog .row { display: flex; gap: 8px; margin-top: 16px; }
  #dialog button {
    font-size: 15px;
    padding: 10px 16px;
    border-radius: 6px;
    border: 1px solid #9aa7b1;
    background: #eef1f4;
    cursor: pointer;
  }
  #btnSave { background: #2e7d32; border-color: #2e7d32; color: #fff; font-weight: 700; margin-left: auto; }
  #btnDelete { background: #fbe9e7; border-color: #c62828; color: #c62828; }

  /* ---------- Fenêtre archives (lecture seule) ---------- */
  #archOverlay {
    position: fixed; inset: 0;
    background: rgba(20, 30, 40, .45);
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
  }
  #archOverlay[hidden] { display: none; }
  #archDialog {
    background: #ffffff;
    border-radius: 10px;
    padding: 22px;
    width: min(760px, 94vw);
    max-height: 86vh;
    overflow: auto;
    box-shadow: 0 12px 40px rgba(0,0,0,.35);
  }
  #archDialog h2 { font-size: 19px; margin-bottom: 4px; }
  #archDialog .archSub { font-size: 14px; color: #43536a; margin-bottom: 8px; }
  .archMonth {
    font-size: 16px;
    margin: 16px 0 6px;
    padding-bottom: 4px;
    border-bottom: 2px solid #d7dce1;
    text-transform: capitalize;
  }
  .archRow {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 6px 2px;
    border-bottom: 1px solid #eef1f4;
    font-size: 14px;
    flex-wrap: wrap;
  }
  .archRow .sw { flex: none; }
  .archWhen { color: #43536a; white-space: nowrap; }
  .archNom { font-weight: 700; }
  .archDet { color: #43536a; }
  .archGarage { margin-left: auto; color: #6a7889; font-size: 13px; }
  .archEmpty { font-size: 15px; color: #43536a; padding: 10px 0; }
  #archDialog .row { display: flex; margin-top: 16px; }
  #btnArchClose {
    font-size: 15px;
    padding: 10px 16px;
    border-radius: 6px;
    border: 1px solid #9aa7b1;
    background: #eef1f4;
    cursor: pointer;
    margin-left: auto;
  }

  /* ---------- Fenêtres client (réservation + confirmation) ---------- */
  .modalOverlay {
    position: fixed; inset: 0;
    background: rgba(20, 30, 40, .45);
    display: flex; align-items: center; justify-content: center;
    z-index: 11;
  }
  .modalOverlay[hidden] { display: none; }
  .modalBox {
    background: #ffffff;
    border-radius: 10px;
    padding: 22px;
    width: min(480px, 92vw);
    max-height: 92vh;
    overflow-y: auto;
    box-shadow: 0 12px 40px rgba(0,0,0,.35);
  }
  .modalBox h2 { font-size: 19px; margin-bottom: 4px; }
  .modalBox .when { font-size: 15px; color: #43536a; margin-bottom: 6px; }
  .modalBox label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #43536a;
    margin: 12px 0 4px;
  }
  .modalBox input[type="text"], .modalBox input[type="tel"] {
    width: 100%;
    font: inherit;
    font-size: 16px;
    padding: 9px;
    border: 1px solid #9aa7b1;
    border-radius: 6px;
  }
  .modalBox input:focus { border-color: #33506e; outline: none; }
  .modalBox select {
    width: 100%;
    font: inherit;
    font-size: 16px;
    padding: 9px;
    border: 1px solid #9aa7b1;
    border-radius: 6px;
    background: #ffffff;
  }
  .modalBox select:focus { border-color: #33506e; outline: none; }
  .modalBox select:disabled { background: #eef1f4; color: #7a8794; }
  /* Grandeurs d'origine proposées : petites options cliquables */
  #cPneusChoix { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  #cPneusChoix .chip {
    font-size: 14px;
    padding: 6px 10px;
    border-radius: 999px;
    border: 1px solid #33506e;
    background: #eef3f8;
    color: #24405c;
    cursor: pointer;
  }
  #cPneusChoix .chip:hover { background: #d9e6f2; }
  #cPneusChoix .chip.sel { background: #33506e; color: #fff; font-weight: 700; }
  #cPneusChoix .chipLbl { font-size: 13px; color: #43536a; align-self: center; }
  /* Véhicule du client, affiché en lecture seule dans la fenêtre du personnel */
  #dlgVehicule {
    margin-top: 14px;
    font-size: 15px;
    color: #24405c;
    background: #eef3f8;
    border: 1px solid #c9d6e2;
    border-radius: 6px;
    padding: 8px 10px;
  }
  .modalBox .err {
    min-height: 20px;
    margin-top: 10px;
    font-size: 14px;
    font-weight: 600;
    color: #c62828;
  }
  .modalBox .row { display: flex; gap: 8px; margin-top: 16px; }
  .modalBox button {
    font-size: 15px;
    padding: 10px 16px;
    border-radius: 6px;
    border: 1px solid #9aa7b1;
    background: #eef1f4;
    cursor: pointer;
  }
  #btnClientConfirm { background: #2e7d32; border-color: #2e7d32; color: #fff; font-weight: 700; margin-left: auto; }
  #btnClientConfirm:disabled { opacity: .6; cursor: wait; }
  #msgText { font-size: 17px; line-height: 1.45; }
  #btnMsgClose { background: #33506e; border-color: #33506e; color: #fff; font-weight: 700; margin-left: auto; }
</style>
</head>
<body>

<!-- ============ ÉCRAN D'ACCÈS ============ -->
<div id="loginScreen">
  <div id="loginBox">
    <h1>Agenda</h1>
    <p>Entrez votre nom d'utilisateur</p>
    <form id="loginForm">
      <input id="loginCode" type="text" inputmode="numeric" autocomplete="off"
             placeholder="Nom d'utilisateur" aria-label="Nom d'utilisateur">
      <div id="loginError" role="alert"></div>
      <button id="btnLogin" type="submit">Entrer</button>
    </form>
    <button id="btnClient" type="button">Voir les disponibilités (client)</button>
  </div>
</div>

<!-- ============ AGENDA ============ -->
<div id="app" hidden>
  <header>
    <span id="sessionBadge"></span>
    <div class="nav">
      <button id="prevWeek" title="Semaine précédente">‹ Préc.</button>
      <button id="todayBtn">Aujourd'hui</button>
      <button id="nextWeek" title="Semaine suivante">Suiv. ›</button>
      <span id="weekLabel"></span>
    </div>
    <div class="legend">
      <span class="sw g1"></span> Garage 1
      <span class="sw g2"></span> Garage 2
      <span id="syncStatus"></span>
    </div>
    <button id="btnArchives">Archives</button>
    <button id="btnLogout">Quitter</button>
  </header>

  <main>
    <table id="grid"></table>
  </main>
</div>

<!-- ============ VUE CLIENT (disponibilités combinées + réservation, sans accès) ============ -->
<div id="clientScreen" hidden>
  <header>
    <span id="clientTitle">Disponibilités</span>
    <div class="nav">
      <button id="clientPrevWeek" title="Semaine précédente">‹ Préc.</button>
      <button id="clientTodayBtn">Aujourd'hui</button>
      <button id="clientNextWeek" title="Semaine suivante">Suiv. ›</button>
      <span id="clientWeekLabel"></span>
    </div>
    <div class="legend">
      <span class="sw free"></span> Libre
      <span class="sw taken"></span> Pris
    </div>
    <button id="btnClientBack">Retour</button>
  </header>

  <main>
    <p id="clientHint">Cliquez sur une case verte (libre) pour réserver ce créneau.</p>
    <table id="clientGrid"></table>
  </main>
</div>

<!-- ============ RÉSERVATION CLIENT ============ -->
<div id="clientOverlay" class="modalOverlay" hidden>
  <div class="modalBox" role="dialog" aria-modal="true">
    <h2>Réserver un rendez-vous</h2>
    <div class="when" id="cWhen"></div>
    <label for="cNom">Nom :</label>
    <input id="cNom" type="text" autocomplete="off" placeholder="Votre nom">
    <label for="cTel">Tél :</label>
    <input id="cTel" type="tel" autocomplete="off" placeholder="Téléphone (facultatif)">
    <label for="cPlaque"># plaque :</label>
    <input id="cPlaque" type="text" autocomplete="off" placeholder="Plaque (facultatif)">
    <label for="cAnnee">Année du véhicule :</label>
    <select id="cAnnee">
      <option value="">— Choisir l'année (facultatif) —</option>
    </select>
    <label for="cMarque">Marque :</label>
    <select id="cMarque" disabled>
      <option value="">— Choisir la marque —</option>
    </select>
    <label for="cModele">Modèle :</label>
    <select id="cModele" disabled>
      <option value="">— Choisir le modèle —</option>
    </select>
    <input id="cVehiculeLibre" type="text" autocomplete="off"
           placeholder="Votre véhicule (marque et modèle)" hidden>
    <label for="cPneus">Grandeur des pneus :</label>
    <input id="cPneus" type="text" autocomplete="off" placeholder="Ex. 205/55 R16 (facultatif)">
    <div id="cPneusChoix"></div>
    <div class="err" id="cError" role="alert"></div>
    <div class="row">
      <button id="btnClientCancel" type="button">Annuler</button>
      <button id="btnClientConfirm" type="button">Confirmer</button>
    </div>
  </div>
</div>

<!-- ============ CONFIRMATION CLIENT ============ -->
<div id="msgOverlay" class="modalOverlay" hidden>
  <div class="modalBox" role="alertdialog" aria-modal="true">
    <p id="msgText"></p>
    <div class="row">
      <button id="btnMsgClose" type="button">Fermer</button>
    </div>
  </div>
</div>

<div id="overlay" hidden>
  <div id="dialog" role="dialog" aria-modal="true">
    <h2 id="dlgTitle">Rendez-vous</h2>
    <div class="when" id="dlgWhen"></div>
    <label for="dlgNom">Nom :</label>
    <input id="dlgNom" type="text" autocomplete="off" placeholder="Nom du client">
    <label for="dlgTel">Tél :</label>
    <input id="dlgTel" type="tel" autocomplete="off" placeholder="Téléphone (facultatif)">
    <label for="dlgPlaque"># plaque :</label>
    <input id="dlgPlaque" type="text" autocomplete="off" placeholder="Plaque (facultatif)">
    <label for="dlgPneus">Grandeur des pneus :</label>
    <input id="dlgPneus" type="text" autocomplete="off" placeholder="Ex. 205/55 R16 (facultatif)">
    <div id="dlgVehicule" hidden></div>
    <div id="dlgError" role="alert"></div>
    <div class="row">
      <button id="btnDelete" hidden>Supprimer</button>
      <button id="btnCancel">Annuler</button>
      <button id="btnSave">Enregistrer</button>
    </div>
  </div>
</div>

<div id="archOverlay" hidden>
  <div id="archDialog" role="dialog" aria-modal="true">
    <h2>Archives</h2>
    <p class="archSub">Rendez-vous de plus de 30 jours, classés par mois — lecture seule.</p>
    <div id="archList"></div>
    <div class="row">
      <button id="btnArchClose">Fermer</button>
    </div>
  </div>
</div>

<!-- SDK Firebase (synchronisation entre les ordinateurs) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
"use strict";
/* =====================================================================
   CONFIGURATION FIREBASE — BRANCHÉE (projet « agenda-rendez-vous-c9657 »)
   ---------------------------------------------------------------------
   La page synchronise les rendez-vous en temps réel entre les deux
   ordinateurs (Realtime Database). Si la configuration était vidée
   (databaseURL vide), la page retomberait en MODE DÉMO (données
   gardées dans le navigateur, sur cet ordinateur seulement).
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyBf87u7E2vaqD7NSTMYFSreVHKd03VvvDk",
  authDomain: "agenda-rendez-vous-c9657.firebaseapp.com",
  databaseURL: "https://agenda-rendez-vous-c9657-default-rtdb.firebaseio.com",
  projectId: "agenda-rendez-vous-c9657",
  storageBucket: "agenda-rendez-vous-c9657.firebasestorage.app",
  messagingSenderId: "136767538573",
  appId: "1:136767538573:web:14670e9a4e146915e7e9c4"
};

/* ---------------- Constantes ---------------- */
/* Accès : le nom d'utilisateur EST le numéro du garage.
   1745 = Garage 1 (cases vertes) — 2850 = Garage 2 (cases bleues).
   (Code du Garage 1 corrigé le 24 nov. 2026 : 1745, le vrai numéro
   civique du garage — l'ancien code 1775 n'est plus accepté.) */
const USERS = { "1745": "g1", "2850": "g2" };
const GARAGE_LABEL = { g1: "Garage 1", g2: "Garage 2" };
const START_HOUR = 8;              // premier créneau : 8 h 00
const END_HOUR = 17;               // fin de journée : 17 h 00
const SLOT_MIN = 30;               // créneaux de 30 minutes
const JOURS = ["lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
const MOIS = ["janv.", "févr.", "mars", "avr.", "mai", "juin",
              "juill.", "août", "sept.", "oct.", "nov.", "déc."];
const MOIS_LONGS = ["janvier", "février", "mars", "avril", "mai", "juin",
                    "juillet", "août", "septembre", "octobre", "novembre", "décembre"];

/* ---------------- État ---------------- */
let currentUser = null;            // "g1" | "g2" | null (écran d'accès)
let clientOpen = false;            // vue client (disponibilités) affichée
let clientEditing = null;          // { date, key } réservation client en cours
let weekOffset = 0;                // 0 = semaine courante
let bookings = { g1: {}, g2: {} }; // bookings[garage][dateISO][cleHeure] = { nom, tel, plaque, pneus }
let editing = null;                // { date, key } en cours d'édition

/* ---------------- Dates ---------------- */
function pad(n) { return String(n).padStart(2, "0"); }
function isoDate(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function mondayOf(base) {
  const d = new Date(base.getFullYear(), base.getMonth(), base.getDate());
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); // lundi = début de semaine
  return d;
}
function weekDays() {
  const mon = mondayOf(new Date());
  mon.setDate(mon.getDate() + weekOffset * 7);
  const days = [];
  for (let i = 0; i < 6; i++) {
    const d = new Date(mon); d.setDate(mon.getDate() + i);
    days.push(d);
  }
  return days;
}
function slotKeys() {
  const keys = [];
  for (let m = START_HOUR * 60; m < END_HOUR * 60; m += SLOT_MIN) keys.push(pad(Math.floor(m / 60)) + pad(m % 60));
  return keys;
}
function keyLabel(key) { return key.slice(0, 2) + " h " + key.slice(2); }
function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}
/* Normalise une entrée stockée vers { nom, tel, plaque, pneus, vehicule }.
   Compatibilité : les anciennes entrées { text } sont lues comme un nom,
   les entrées sans « pneus » (avant l'ajout du champ) donnent "", et les
   entrées sans « vehicule » (avant le sélecteur de véhicule) donnent null. */
function normEntry(entry) {
  if (!entry) return null;
  const nom = entry.nom || entry.text || "";
  const tel = entry.tel || "";
  const plaque = entry.plaque || "";
  const pneus = entry.pneus || "";
  let vehicule = null;
  const v = entry.vehicule;
  if (v && (v.marque || v.modele || v.annee)) {
    vehicule = {
      annee: v.annee || "",
      marque: v.marque || "",
      modele: v.modele || ""
    };
  }
  if (!nom && !tel && !plaque && !pneus) return null;
  return { nom: nom, tel: tel, plaque: plaque, pneus: pneus, vehicule: vehicule };
}
/* « 2021 Ford F-150 » — texte d'affichage du véhicule (personnel/archives). */
function vehiculeLabel(v) {
  if (!v) return "";
  return [v.annee, v.marque, v.modele].filter(function (x) { return !!x; }).join(" ");
}
</script>

<script>
/* =====================================================================
   COUCHE DONNÉES — deux modes :
   1) FIREBASE (si configuré) : synchronisation temps réel entre les
      deux ordinateurs, structure : rdv/g1/<date>/<heure> =
      { nom, tel, plaque, pneus } (g1 = cases vertes / Garage 1,
      g2 = cases bleues / Garage 2) ; archives mensuelles sous
      rdv_archive/<AAAA-MM>/<garage>/<date>/<heure>.
   2) DÉMO (sinon) : localStorage de ce navigateur + événement
      « storage » pour synchroniser les onglets/fenêtres du même poste.
   ===================================================================== */
const DEMO_KEY = "pneus-rdv-demo-v1";
const DEMO_ARCH_KEY = "pneus-rdv-archive-v1";
const demoMode = !firebaseConfig.databaseURL;
let useLocal = demoMode;  // passe aussi à true en repli si Firebase est injoignable
let dbRef = null;
let archRef = null;
let archives = {};        // archives["AAAA-MM"][garage][date][heure] = { nom, tel, plaque, pneus }
let archivingDone = false;

function loadDemo() {
  try {
    const raw = localStorage.getItem(DEMO_KEY);
    if (raw) bookings = Object.assign({ g1: {}, g2: {} }, JSON.parse(raw));
  } catch (e) { /* données illisibles : on repart à vide */ }
}
function saveDemo() {
  try { localStorage.setItem(DEMO_KEY, JSON.stringify(bookings)); } catch (e) {}
}
function loadDemoArchives() {
  try {
    const raw = localStorage.getItem(DEMO_ARCH_KEY);
    archives = raw ? (JSON.parse(raw) || {}) : {};
  } catch (e) { archives = {}; }
}
function saveDemoArchives() {
  try { localStorage.setItem(DEMO_ARCH_KEY, JSON.stringify(archives)); } catch (e) {}
}

function setBooking(garage, date, key, data) {
  // data = { nom, tel, plaque, pneus } pour enregistrer, null pour supprimer.
  // Garde-fou : on n'écrit JAMAIS dans la couleur de l'autre garage
  if (garage !== currentUser) return;
  if (useLocal) {
    if (!bookings[garage][date]) bookings[garage][date] = {};
    if (data) bookings[garage][date][key] = data;
    else {
      delete bookings[garage][date][key];
      if (!Object.keys(bookings[garage][date]).length) delete bookings[garage][date];
    }
    saveDemo();
    renderActive();
  } else {
    const ref = dbRef.child(garage + "/" + date + "/" + key);
    if (data) {
      const rec = { nom: data.nom, tel: data.tel || "", plaque: data.plaque || "", pneus: data.pneus || "", maj: Date.now() };
      // Le véhicule choisi par le client est conservé tel quel : le
      // formulaire du personnel ne le modifie pas, on le réécrit donc
      // à l'identique pour ne pas l'effacer lors d'une modification.
      if (data.vehicule) rec.vehicule = data.vehicule;
      ref.set(rec);
    }
    else ref.remove();
    // le rendu se fait par l'écouteur temps réel (on value)
  }
}

/* ---------------- Réservation par un CLIENT ----------------
   Le client ne choisit pas le garage : le rendez-vous est inscrit
   dans le garage où l'heure est libre — Garage 1 (1745) d'abord,
   sinon Garage 2 (2850). La disponibilité est revérifiée AU MOMENT
   de confirmer :
   - Mode démo : vérification et écriture immédiates (localStorage).
   - Firebase : TRANSACTION sur la case (comparaison et écriture
     côté serveur) — si une autre réservation gagne la course, la
     transaction avorte et on essaie l'autre garage.
   Retourne une promesse : "g1", "g2" ou null (pris partout). */
function clientBookLocal(date, key, data) {
  const order = ["g1", "g2"];
  for (let i = 0; i < order.length; i++) {
    const g = order[i];
    if (!normEntry(((bookings[g] || {})[date] || {})[key])) {
      if (!bookings[g][date]) bookings[g][date] = {};
      const rec = { nom: data.nom, tel: data.tel || "", plaque: data.plaque || "", pneus: data.pneus || "" };
      if (data.vehicule) rec.vehicule = data.vehicule;
      bookings[g][date][key] = rec;
      saveDemo();
      renderActive();
      return g;
    }
  }
  return null;
}
function clientTryFirebase(garage, date, key, data) {
  const ref = dbRef.child(garage + "/" + date + "/" + key);
  return ref.transaction(function (cur) {
    if (normEntry(cur)) return undefined; // déjà pris : on avorte
    const rec = { nom: data.nom, tel: data.tel || "", plaque: data.plaque || "", pneus: data.pneus || "", maj: Date.now() };
    if (data.vehicule) rec.vehicule = data.vehicule;
    return rec;
  }).then(function (res) { return !!(res && res.committed); });
}
function clientBook(date, key, data) {
  if (useLocal) return Promise.resolve(clientBookLocal(date, key, data));
  return clientTryFirebase("g1", date, key, data).then(function (ok1) {
    if (ok1) return "g1";
    return clientTryFirebase("g2", date, key, data).then(function (ok2) {
      return ok2 ? "g2" : null;
    });
  });
}

/* ---------------- Archivage mensuel ----------------
   À chaque chargement, les rendez-vous dont la date est passée
   depuis PLUS DE 30 JOURS sont déplacés dans les archives,
   classés par mois (« dossier » AAAA-MM) :
   - Firebase : rdv_archive/<AAAA-MM>/<garage>/<date>/<heure>
   - Démo : localStorage, même structure. */
function isArchivable(dateIso) {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - 30);
  return dateIso < isoDate(d); // strictement plus de 30 jours passés
}
function collectArchivable() {
  const moves = [];
  ["g1", "g2"].forEach(function (g) {
    const byDate = bookings[g] || {};
    Object.keys(byDate).forEach(function (date) {
      if (!isArchivable(date)) return;
      Object.keys(byDate[date] || {}).forEach(function (key) {
        const entry = normEntry(byDate[date][key]);
        if (entry) moves.push({ garage: g, date: date, key: key, entry: entry, mois: date.slice(0, 7) });
      });
    });
  });
  return moves;
}
function archiveOldBookings() {
  const moves = collectArchivable();
  if (!moves.length) return;
  if (useLocal) {
    moves.forEach(function (m) {
      if (!archives[m.mois]) archives[m.mois] = { g1: {}, g2: {} };
      if (!archives[m.mois][m.garage]) archives[m.mois][m.garage] = {};
      if (!archives[m.mois][m.garage][m.date]) archives[m.mois][m.garage][m.date] = {};
      archives[m.mois][m.garage][m.date][m.key] = m.entry;
      delete bookings[m.garage][m.date][m.key];
      if (!Object.keys(bookings[m.garage][m.date]).length) delete bookings[m.garage][m.date];
    });
    saveDemo();
    saveDemoArchives();
    renderActive();
  } else if (dbRef && archRef) {
    moves.forEach(function (m) {
      archRef.child(m.mois + "/" + m.garage + "/" + m.date + "/" + m.key).set(m.entry);
      dbRef.child(m.garage + "/" + m.date + "/" + m.key).remove();
    });
    // les écouteurs temps réel resynchroniseront bookings et archives
  }
}

function initData() {
  const status = document.getElementById("syncStatus");
  if (demoMode || typeof firebase === "undefined") {
    useLocal = true;
    loadDemo();
    loadDemoArchives();
    status.textContent = "Mode démo — données sur cet ordinateur seulement";
    window.addEventListener("storage", function (e) {
      if (e.key === DEMO_KEY) { loadDemo(); renderActive(); }
      if (e.key === DEMO_ARCH_KEY) { loadDemoArchives(); if (!archOverlay.hidden) renderArchives(); }
    });
    archiveOldBookings();
    renderActive();
    return;
  }
  try {
    firebase.initializeApp(firebaseConfig);
    dbRef = firebase.database().ref("rdv");
    archRef = firebase.database().ref("rdv_archive");
    status.textContent = "Synchronisé";
    archRef.on("value", function (snap) {
      archives = snap.val() || {};
      if (!archOverlay.hidden) renderArchives();
    });
    dbRef.on("value", function (snap) {
      bookings = Object.assign({ g1: {}, g2: {} }, snap.val() || {});
      if (!archivingDone) { archivingDone = true; archiveOldBookings(); }
      renderActive();
    }, function () {
      status.textContent = "Synchronisation interrompue — vérifiez la connexion";
    });
  } catch (e) {
    // Configuration invalide : repli en mode démo pour ne jamais bloquer le garage
    useLocal = true;
    loadDemo();
    loadDemoArchives();
    status.textContent = "Mode démo — données sur cet ordinateur seulement";
    archiveOldBookings();
    renderActive();
  }
}

/* ---------------- Affichage de la grille ----------------
   UN SEUL agenda. Chaque créneau contient DEUX cases côte à côte :
   à gauche la case VERTE (Garage 1), à droite la case BLEUE (Garage 2).
   Seule la couleur de l'utilisateur connecté est cliquable ;
   l'autre s'affiche en lecture seule, atténuée. */
function cellHtml(garage, date, key) {
  const entry = normEntry(((bookings[garage] || {})[date] || {})[key]);
  const mine = garage === currentUser;
  let cls = "cell " + garage + (mine ? " mine" : " theirs") + (entry ? " booked" : "");
  let inner = "";
  if (entry) {
    // Le nom en évidence ; en petit en dessous, sur la même ligne :
    // le # de plaque et la grandeur des pneus, quand ils sont présents
    // (la case garde sa hauteur — les deux détails tiennent sur une ligne).
    inner = "<span class='nm'>" + esc(entry.nom) + "</span>";
    const det = [];
    if (entry.plaque) det.push("#" + esc(entry.plaque));
    if (entry.pneus) det.push(esc(entry.pneus));
    if (det.length) inner += "<span class='pl'>" + det.join(" · ") + "</span>";
  }
  let titleTxt = "";
  if (entry) {
    titleTxt = entry.nom;
    if (entry.plaque) titleTxt += " — #" + entry.plaque;
    if (entry.pneus) titleTxt += " — Pneus : " + entry.pneus;
    if (entry.tel) titleTxt += " — " + entry.tel;
  }
  const title = titleTxt ? " title='" + esc(titleTxt) + "'" : "";
  const data = mine ? " data-date='" + date + "' data-key='" + key + "'" : "";
  return "<div class='" + cls + "'" + data + title + ">" + inner + "</div>";
}

function render() {
  if (!currentUser) return;
  const days = weekDays();
  const todayIso = isoDate(new Date());
  const first = days[0], last = days[5];
  document.getElementById("weekLabel").textContent =
    "Semaine du " + first.getDate() + " " + MOIS[first.getMonth()] +
    " au " + last.getDate() + " " + MOIS[last.getMonth()] + " " + last.getFullYear();

  const grid = document.getElementById("grid");
  let html = "<thead><tr><th>Heure</th>";
  days.forEach(function (d, i) {
    const isToday = isoDate(d) === todayIso;
    html += "<th class='" + (isToday ? "today" : "") + "'><span class='dow'>" + JOURS[i] +
            "</span>" + d.getDate() + " " + MOIS[d.getMonth()] + "</th>";
  });
  html += "</tr></thead><tbody>";

  slotKeys().forEach(function (key) {
    html += "<tr><td class='time'>" + keyLabel(key) + "</td>";
    days.forEach(function (d) {
      const date = isoDate(d);
      const isToday = date === todayIso;
      html += "<td class='slot" + (isToday ? " today-col" : "") + "'><div class='cells'>" +
              cellHtml("g1", date, key) +
              cellHtml("g2", date, key) +
              "</div></td>";
    });
    html += "</tr>";
  });
  html += "</tbody>";
  grid.innerHTML = html;
}

/* Rafraîchit la vue affichée (agenda du garage ou vue client) */
function renderActive() {
  if (currentUser) render();
  if (clientOpen) renderClient();
}

/* ---------------- Vue CLIENT (sans accès) ----------------
   UNE SEULE grille de disponibilités COMBINÉES des deux garages :
   case verte = l'heure est libre dans au moins un garage ;
   case avec « ✗ » = l'heure est prise dans les DEUX garages.
   AUCUN détail de rendez-vous n'est affiché (jamais les noms, les
   tél ou les plaques). Un clic sur une case verte ouvre le
   formulaire de réservation (voir plus bas). */
function renderClient() {
  if (!clientOpen) return;
  const days = weekDays();
  const todayIso = isoDate(new Date());
  const first = days[0], last = days[5];
  document.getElementById("clientWeekLabel").textContent =
    "Semaine du " + first.getDate() + " " + MOIS[first.getMonth()] +
    " au " + last.getDate() + " " + MOIS[last.getMonth()] + " " + last.getFullYear();

  const grid = document.getElementById("clientGrid");
  let html = "<thead><tr><th>Heure</th>";
  days.forEach(function (d, i) {
    const isToday = isoDate(d) === todayIso;
    html += "<th class='" + (isToday ? "today" : "") + "'><span class='dow'>" + JOURS[i] +
            "</span>" + d.getDate() + " " + MOIS[d.getMonth()] + "</th>";
  });
  html += "</tr></thead><tbody>";
  slotKeys().forEach(function (key) {
    html += "<tr><td class='time'>" + keyLabel(key) + "</td>";
    days.forEach(function (d) {
      const date = isoDate(d);
      // Seule la PRÉSENCE des rendez-vous est lue — jamais leur contenu
      const takenG1 = !!normEntry(((bookings.g1 || {})[date] || {})[key]);
      const takenG2 = !!normEntry(((bookings.g2 || {})[date] || {})[key]);
      const taken = takenG1 && takenG2; // « ✗ » seulement si pris dans les deux garages
      html += "<td class='slot'><div class='ccell " + (taken ? "taken" : "free") + "'" +
              (taken ? "" : " data-date='" + date + "' data-key='" + key + "'") + ">" +
              (taken ? "✗" : "") + "</div></td>";
    });
    html += "</tr>";
  });
  html += "</tbody>";
  grid.innerHTML = html;
}

/* ---------------- Fenêtre d'édition (sa couleur seulement) ----------------
   Le formulaire contient EXACTEMENT quatre champs :
   Nom, Tél, # plaque, Grandeur des pneus. */
const overlay = document.getElementById("overlay");
const dlgNom = document.getElementById("dlgNom");
const dlgTel = document.getElementById("dlgTel");
const dlgPlaque = document.getElementById("dlgPlaque");
const dlgPneus = document.getElementById("dlgPneus");
const dlgError = document.getElementById("dlgError");
const btnDelete = document.getElementById("btnDelete");

function openEditor(date, key) {
  if (!currentUser) return;
  editing = { date: date, key: key };
  const entry = normEntry(((bookings[currentUser] || {})[date] || {})[key]);
  const d = new Date(date + "T12:00:00");
  document.getElementById("dlgTitle").textContent = entry ? "Modifier le rendez-vous" : "Nouveau rendez-vous";
  document.getElementById("dlgWhen").textContent =
    GARAGE_LABEL[currentUser] + " — " + JOURS[(d.getDay() + 6) % 7] + " " + d.getDate() + " " +
    MOIS[d.getMonth()] + " " + d.getFullYear() + ", " + keyLabel(key);
  dlgNom.value = entry ? entry.nom : "";
  dlgTel.value = entry ? entry.tel : "";
  dlgPlaque.value = entry ? entry.plaque : "";
  dlgPneus.value = entry ? entry.pneus : "";
  // Véhicule choisi par le client : lecture seule, sous les champs.
  // Le formulaire du personnel ne change pas ; le véhicule est
  // conservé tel quel à l'enregistrement (voir btnSave).
  const dlgVehicule = document.getElementById("dlgVehicule");
  const vLab = entry ? vehiculeLabel(entry.vehicule) : "";
  if (vLab) {
    dlgVehicule.textContent = "Véhicule : " + vLab;
    dlgVehicule.hidden = false;
  } else {
    dlgVehicule.textContent = "";
    dlgVehicule.hidden = true;
  }
  dlgError.textContent = "";
  btnDelete.hidden = !entry;
  overlay.hidden = false;
  dlgNom.focus();
}
function closeEditor() { overlay.hidden = true; editing = null; }

document.getElementById("grid").addEventListener("click", function (e) {
  const cell = e.target.closest(".cell.mine");
  if (cell) openEditor(cell.dataset.date, cell.dataset.key);
  // les cases « theirs » n'ont ni écouteur ni data-* : clic sans effet
});
document.getElementById("btnSave").addEventListener("click", function () {
  if (!editing) return;
  const nom = dlgNom.value.trim();
  if (!nom) {
    // Le nom est obligatoire : on n'enregistre pas sans lui
    dlgError.textContent = "Le nom est obligatoire.";
    dlgNom.focus();
    return;
  }
  // Le véhicule déjà enregistré (choisi par le client) est conservé
  // tel quel : le personnel ne le saisit pas dans ce formulaire.
  const existing = normEntry(((bookings[currentUser] || {})[editing.date] || {})[editing.key]);
  const data = {
    nom: nom,
    tel: dlgTel.value.trim(),
    plaque: dlgPlaque.value.trim(),
    pneus: dlgPneus.value.trim()
  };
  if (existing && existing.vehicule) data.vehicule = existing.vehicule;
  setBooking(currentUser, editing.date, editing.key, data);
  closeEditor();
});
document.getElementById("btnDelete").addEventListener("click", function () {
  if (!editing) return;
  setBooking(currentUser, editing.date, editing.key, null);
  closeEditor();
});
document.getElementById("btnCancel").addEventListener("click", closeEditor);
overlay.addEventListener("click", function (e) { if (e.target === overlay) closeEditor(); });
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && !overlay.hidden) closeEditor();
  if (e.key === "Escape" && !archOverlay.hidden) closeArchives();
  if (e.key === "Escape" && !clientOverlay.hidden) closeClientForm();
  if (e.key === "Escape" && !msgOverlay.hidden) msgOverlay.hidden = true;
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && !overlay.hidden) document.getElementById("btnSave").click();
});

/* ---------------- Archives (lecture seule) ----------------
   Les rendez-vous archivés, classés par mois (« dossier » AAAA-MM).
   Nom, tél, # plaque, grandeur des pneus, date, heure et couleur
   du garage sont montrés ; AUCUNE modification n'est possible
   dans cette vue. */
const archOverlay = document.getElementById("archOverlay");
const archList = document.getElementById("archList");

function monthLabel(mois) {
  const y = mois.slice(0, 4);
  const m = parseInt(mois.slice(5, 7), 10);
  return MOIS_LONGS[m - 1] + " " + y;
}
function renderArchives() {
  const months = Object.keys(archives).sort().reverse();
  let html = "";
  months.forEach(function (mois) {
    const rows = [];
    ["g1", "g2"].forEach(function (g) {
      const byDate = (archives[mois] || {})[g] || {};
      Object.keys(byDate).forEach(function (date) {
        Object.keys(byDate[date] || {}).forEach(function (key) {
          const e = normEntry(byDate[date][key]);
          if (e) rows.push({ g: g, date: date, key: key, e: e });
        });
      });
    });
    if (!rows.length) return;
    rows.sort(function (a, b) { return (a.date + a.key) < (b.date + b.key) ? -1 : 1; });
    html += "<h3 class='archMonth'>" + esc(monthLabel(mois)) + "</h3>";
    rows.forEach(function (r) {
      const d = new Date(r.date + "T12:00:00");
      const when = JOURS[(d.getDay() + 6) % 7] + " " + d.getDate() + " " + MOIS[d.getMonth()] + " " +
                   d.getFullYear() + " — " + keyLabel(r.key);
      let det = "";
      if (r.e.tel) det = "Tél : " + esc(r.e.tel);
      if (r.e.plaque) det += (det ? " · " : "") + "#" + esc(r.e.plaque);
      if (r.e.pneus) det += (det ? " · " : "") + "Pneus : " + esc(r.e.pneus);
      const vLab = vehiculeLabel(r.e.vehicule);
      if (vLab) det += (det ? " · " : "") + "Véhicule : " + esc(vLab);
      html += "<div class='archRow'><span class='sw " + r.g + "'></span>" +
              "<span class='archWhen'>" + when + "</span>" +
              "<span class='archNom'>" + esc(r.e.nom) + "</span>" +
              (det ? "<span class='archDet'>" + det + "</span>" : "") +
              "<span class='archGarage'>" + GARAGE_LABEL[r.g] + "</span></div>";
    });
  });
  archList.innerHTML = html || "<p class='archEmpty'>Aucun rendez-vous archivé pour le moment.</p>";
}
function openArchives() { renderArchives(); archOverlay.hidden = false; }
function closeArchives() { archOverlay.hidden = true; }
document.getElementById("btnArchives").addEventListener("click", openArchives);
document.getElementById("btnArchClose").addEventListener("click", closeArchives);
archOverlay.addEventListener("click", function (e) { if (e.target === archOverlay) closeArchives(); });

/* ---------------- Accès / session ---------------- */
const loginScreen = document.getElementById("loginScreen");
const appEl = document.getElementById("app");
const loginCode = document.getElementById("loginCode");
const loginError = document.getElementById("loginError");
const sessionBadge = document.getElementById("sessionBadge");

function enterApp(garage) {
  currentUser = garage;
  sessionBadge.textContent = GARAGE_LABEL[garage];
  sessionBadge.className = garage;
  sessionBadge.id = "sessionBadge";
  loginError.textContent = "";
  loginCode.value = "";
  loginScreen.hidden = true;
  appEl.hidden = false;
  render();
}
function exitApp() {

const cAnnee = document.getElementById("cAnnee");

function vehFillSelect(sel, placeholder, values) {
  sel.innerHTML = "";
  const opt0 = document.createElement("option");
  opt0.value = "";
  opt0.textContent = placeholder;
  sel.appendChild(opt0);
  values.forEach(function (v) {
    const o = document.createElement("option");
    o.value = v;
    o.textContent = v;
    sel.appendChild(o);
  });
}
/* Grandeurs d'origine du modèle pour l'année, ou null si inconnues. */
function vehSizes(marque, modele, annee) {
  const plages = (VEHICULES[marque] || {})[modele];
  if (!plages) return null;
  const y = parseInt(annee, 10);
  if (!y) return null;
  for (let i = 0; i < plages.length; i++) {
    if (y >= plages[i][0] && y <= plages[i][1]) return plages[i][2];
  }
  return null;
}
/* Affiche les grandeurs connues en petites options cliquables ;
   une seule grandeur = pré-remplissage direct du champ. */
function vehShowSizes() {
  cPneusChoix.innerHTML = "";
  const sizes = vehSizes(cMarque.value, cModele.value, cAnnee.value);
  if (!sizes || !sizes.length) return;
  if (sizes.length === 1) { cPneus.value = sizes[0]; return; }
  const lbl = document.createElement("span");
  lbl.className = "chipLbl";
  lbl.textContent = "Grandeurs d'origine :";
  cPneusChoix.appendChild(lbl);
  sizes.forEach(function (s) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (cPneus.value === s ? " sel" : "");
    b.textContent = s;
    b.addEventListener("click", function () {
      cPneus.value = s;
      vehShowSizes();
    });
    cPneusChoix.appendChild(b);
  });
}
function vehOnAnnee() {
  cPneusChoix.innerHTML = "";
  cVehiculeLibre.hidden = true;
  cVehiculeLibre.value = "";
  if (!cAnnee.value) {
    vehFillSelect(cMarque, "— Choisir la marque —", []);
    cMarque.disabled = true;
    vehFillSelect(cModele, "— Choisir le modèle —", []);
    cModele.disabled = true;
    return;
  }
  const y = parseInt(cAnnee.value, 10);
  const marques = Object.keys(VEHICULES).filter(function (m) {
    return Object.keys(VEHICULES[m]).some(function (mod) {
      return VEHICULES[m][mod].some(function (p) { return y >= p[0] && y <= p[1]; });
    });
  });
  marques.push(VEH_AUTRE_MARQUE);
  vehFillSelect(cMarque, "— Choisir la marque —", marques);
  // Libellé lisible pour le choix de repli
  cMarque.querySelector("option[value='" + VEH_AUTRE_MARQUE + "']").textContent = "Autre marque";
  cMarque.disabled = false;
  vehFillSelect(cModele, "— Choisir le modèle —", []);
  cModele.disabled = true;
}
function vehOnMarque() {
  cPneusChoix.innerHTML = "";
  vehFillSelect(cModele, "— Choisir le modèle —", []);
  if (!cMarque.value) {
    cModele.disabled = true;
    cVehiculeLibre.hidden = true;
    cVehiculeLibre.value = "";
    return;
  }
  if (cMarque.value === VEH_AUTRE_MARQUE) {
    cModele.disabled = true;
    cVehiculeLibre.hidden = false;
    return;
  }
  cVehiculeLibre.hidden = true;
  cVehiculeLibre.value = "";
  const y = parseInt(cAnnee.value, 10);
  const modeles = Object.keys(VEHICULES[cMarque.value] || {}).filter(function (mod) {
    return VEHICULES[cMarque.value][mod].some(function (p) { return y >= p[0] && y <= p[1]; });
  });
  modeles.push(VEH_AUTRE_MODELE);
  vehFillSelect(cModele, "— Choisir le modèle —", modeles);
  cModele.querySelector("option[value='" + VEH_AUTRE_MODELE + "']").textContent = "Autre modèle";
  cModele.disabled = false;
}
function vehOnModele() {
  if (cModele.value === VEH_AUTRE_MODELE) {
    cPneusChoix.innerHTML = "";
    cVehiculeLibre.hidden = false;
  } else {
    cVehiculeLibre.hidden = true;
    cVehiculeLibre.value = "";
    vehShowSizes();
  }
}
/* Véhicule à enregistrer : { annee, marque, modele } ou null si rien
   n'a été choisi. Le texte libre « Autre » est rangé tel quel. */
function vehCollect() {
  const annee = cAnnee.value || "";
  let marque = "", modele = "";
  if (cMarque.value === VEH_AUTRE_MARQUE) {
    const libre = cVehiculeLibre.value.trim();
    if (!annee && !libre) return null;
    marque = libre;
  } else if (cMarque.value) {
    marque = cMarque.value;
    if (cModele.value === VEH_AUTRE_MODELE) modele = cVehiculeLibre.value.trim();
    else modele = cModele.value || "";
  }
  if (!annee && !marque && !modele) return null;
  return { annee: annee, marque: marque, modele: modele };
}
function vehReset() {
  vehFillSelect(cAnnee, "— Choisir l'année (facultatif) —",
    Array.from({ length: VEH_ANNEE_MAX - VEH_ANNEE_MIN + 1 },
               function (_, i) { return String(VEH_ANNEE_MAX - i); }));
  vehFillSelect(cMarque, "— Choisir la marque —", []);
  cMarque.disabled = true;
  vehFillSelect(cModele, "— Choisir le modèle —", []);
  cModele.disabled = true;
  cVehiculeLibre.hidden = true;
  cVehiculeLibre.value = "";
  cPneusChoix.innerHTML = "";
}
cAnnee.addEventListener("change", vehOnAnnee);
cMarque.addEventListener("change", vehOnMarque);
cModele.addEventListener("change", vehOnModele);
cPneus.addEventListener("input", function () {
  // La sélection visuelle des options suit le texte du champ
  Array.prototype.forEach.call(cPneusChoix.querySelectorAll(".chip"), function (ch) {
    ch.classList.toggle("sel", ch.textContent === cPneus.value);
  });
});

/* « mardi 25 nov. à 9 h 30 » */
function dateLongue(dateIsoStr, key) {
  const d = new Date(dateIsoStr + "T12:00:00");
  return JOURS[(d.getDay() + 6) % 7] + " " + d.getDate() + " " + MOIS[d.getMonth()] +
         " à " + keyLabel(key).replace(/^0/, "");
}
function openClientForm(date, key) {
  clientEditing = { date: date, key: key };
  document.getElementById("cWhen").textContent = dateLongue(date, key);
  cNom.value = "";
  cTel.value = "";
  cPlaque.value = "";
  cPneus.value = "";
  vehReset();
  cError.textContent = "";
  btnClientConfirm.disabled = false;
  clientOverlay.hidden = false;
  cNom.focus();
}
function closeClientForm() { clientOverlay.hidden = true; clientEditing = null; }
function showClientMsg(text) { msgText.textContent = text; msgOverlay.hidden = false; }

document.getElementById("clientGrid").addEventListener("click", function (e) {
  const cell = e.target.closest(".ccell.free");
  if (cell) openClientForm(cell.dataset.date, cell.dataset.key);
  // les cases « ✗ » n'ont pas de data-* : clic sans effet
});
document.getElementById("btnClientCancel").addEventListener("click", closeClientForm);
clientOverlay.addEventListener("click", function (e) { if (e.target === clientOverlay) closeClientForm(); });
document.getElementById("btnMsgClose").addEventListener("click", function () { msgOverlay.hidden = true; });
msgOverlay.addEventListener("click", function (e) { if (e.target === msgOverlay) msgOverlay.hidden = true; });

btnClientConfirm.addEventListener("click", function () {
  if (!clientEditing) return;
  const nom = cNom.value.trim();
  if (!nom) {
    // Le nom est obligatoire : on n'enregistre pas sans lui
    cError.textContent = "Le nom est obligatoire.";
    cNom.focus();
    return;
  }
  const data = { nom: nom, tel: cTel.value.trim(), plaque: cPlaque.value.trim(), pneus: cPneus.value.trim() };
  const veh = vehCollect();
  if (veh) data.vehicule = veh;
  const target = { date: clientEditing.date, key: clientEditing.key };
  btnClientConfirm.disabled = true;
  cError.textContent = "";
  // Filet de sécurité : si la réponse traîne (connexion lente),
  // on réactive le bouton avec un message plutôt que de bloquer.
  const timeout = new Promise(function (resolve) {
    setTimeout(function () { resolve("timeout"); }, 12000);
  });
  Promise.race([clientBook(target.date, target.key, data), timeout]).then(function (result) {
    btnClientConfirm.disabled = false;
    if (result === "timeout") {
      cError.textContent = "La réservation n'a pas abouti — vérifiez votre connexion et réessayez.";
      return;
    }
    if (!result) {
      // L'heure vient d'être prise dans les deux garages entre-temps
      cError.textContent = "Ce créneau vient d'être pris, choisissez une autre heure.";
      renderClient();
      return;
    }
    const when = dateLongue(target.date, target.key);
    closeClientForm();
    showClientMsg("Votre rendez-vous est confirmé : " + GARAGE_LABEL[result] + " — " + when + ".");
  }).catch(function () {
    btnClientConfirm.disabled = false;
    cError.textContent = "La réservation n'a pas abouti — vérifiez votre connexion et réessayez.";
  });
});
document.getElementById("clientPrevWeek").addEventListener("click", function () { weekOffset--; renderClient(); });
document.getElementById("clientNextWeek").addEventListener("click", function () { weekOffset++; renderClient(); });
document.getElementById("clientTodayBtn").addEventListener("click", function () { weekOffset = 0; renderClient(); });

/* ---------------- Navigation ---------------- */
document.getElementById("prevWeek").addEventListener("click", function () { weekOffset--; render(); });
document.getElementById("nextWeek").addEventListener("click", function () { weekOffset++; render(); });
document.getElementById("todayBtn").addEventListener("click", function () { weekOffset = 0; render(); });

/* ---------------- Démarrage ---------------- */
initData();
loginCode.focus();
</script>
